# Auralis stack: API + MySQL + MinIO, all in one file.
#
#   docker compose up -d --build          # everything: API + MySQL + MinIO
#   docker compose down                   # stop it
#
# For the code-edit loop (API from your IDE / Maven instead of a container):
#   docker compose up -d mysql minio minio-init   # infra only
#   mvn spring-boot:run                            # dev profile
#
# MySQL is published on host 3307 (not 3306) so it never clashes with a local
# MySQL. The containerised API reaches MySQL/MinIO over the compose network.
name: auralis

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: auralis-backend:latest
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: auralis
      DB_USER: root
      DB_PASSWORD: root123
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: auralis-media
      S3_PATH_STYLE: "true"
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      # Override these in a real deployment.
      JWT_SECRET: ${JWT_SECRET:-c2VjcmV0LWRldi1vbmx5LWNoYW5nZS1tZS1wbGVhc2UtMzJieXRlcyEhMTIzNA==}
      FRONTEND_REDIRECT_URI: ${FRONTEND_REDIRECT_URI:-http://localhost:5173/oauth/callback}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-changeme}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-changeme}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-changeme}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-changeme}
    ports:
      - "8080:8080"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: auralis
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Creates the bucket on first boot so the app has somewhere to write.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio...'; sleep 2;
        done
        mc mb --ignore-existing local/auralis-media
        mc anonymous set none local/auralis-media
        echo 'bucket ready'

volumes:
  mysql-data:
  minio-data:
