# Auralis frontend — standalone.
#
# This builds and runs ONLY the frontend container. The backend is expected to
# be running elsewhere (its own host / its own compose project / a cluster) and
# is reached over the network via BACKEND_ORIGIN.
#
#   cp .env.example .env      # set BACKEND_ORIGIN to your API URL
#   docker compose up -d --build
#   # -> http://localhost:4200
#
# The image itself is portable: `docker run -e BACKEND_ORIGIN=... auralis-frontend`.

name: auralis-frontend

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: auralis-frontend:latest
    environment:
      # Full origin of the Auralis API. Local backend on the Docker host:
      #   http://host.docker.internal:8080
      # Real deployment: https://api.your-domain.example
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://host.docker.internal:8080}
      # DNS nginx uses to resolve BACKEND_ORIGIN's host at request time.
      # 127.0.0.11 = Docker's embedded DNS; change for k8s / bare metal.
      RESOLVER: ${RESOLVER:-127.0.0.11}
    ports:
      - "${WEB_PORT:-4200}:4200"
    # Makes host.docker.internal resolve on Linux too (no-op on Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
