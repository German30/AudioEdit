# Production profile. Every secret comes from the environment; nothing here has
# a usable default. Flyway owns the schema and Hibernate only validates it.
spring:
  docker-compose:
    enabled: false
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

auralis:
  auth:
    dev-login-enabled: false

logging:
  level:
    com.auralis: INFO
    org.springframework.web: WARN
